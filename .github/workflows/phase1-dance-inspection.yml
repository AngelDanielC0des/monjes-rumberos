name: Phase 1 — inspect dance source frames

on:
  push:
    branches:
      - 'codex/monjes-rumberos-phase-0'
    paths:
      - 'scripts/inspect-dance-assets.py'
      - '.github/workflows/phase1-dance-inspection.yml'
      - 'assets/monks/dance/*.webp'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image inspection dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Extract frames and inspect alpha
        run: python scripts/inspect-dance-assets.py

      - name: Upload inspection package
        uses: actions/upload-artifact@v4
        with:
          name: phase1-dance-source-inspection
          path: phase1-dance-inspection/
          if-no-files-found: error
          retention-days: 7

name: Import complete Monjes Rumberos project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-production.yml"

permissions:
  contents: write

concurrency:
  group: monjes-rumberos-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project source
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/source-part-*.b64 > /tmp/monjes-source.tar.gz.b64
          base64 --decode /tmp/monjes-source.tar.gz.b64 | tar -xz
          rm -rf transfer
          test -s index.html
          test -s styles.css
          test -s GITHUB_PUBLIC_ASSETS.txt

      - name: Restore production image assets from Vercel
        shell: bash
        env:
          DEPLOY_URL: https://monjes-rumberos.vercel.app
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              assets/*)
                mkdir -p "$(dirname "$path")"
                curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$DEPLOY_URL/$path" --output "$path"
                ;;
            esac
          done < GITHUB_PUBLIC_ASSETS.txt
          test -s assets/images/monjes-frame.webp
          test -s assets/monks/monjes-frame-desktop.webp
          test -s assets/sections/manifest.json
          test "$(find assets/sections -maxdepth 1 -name '*.webp' | wc -l | tr -d ' ')" -eq 16

      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Verify source and responsive behavior
        run: |
          npm run check
          npm test
          npm run build
          test -s public/index.html
          test -s public/styles.css
          test -s public/assets/monks/dance/monje-left-dance.webp
          test -s public/assets/monks/dance/monje-right-dance.webp
          test "$(find public -type f | wc -l | tr -d ' ')" -eq 39

      - name: Commit complete source and assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import complete source, assets and responsive QA"
          git push origin HEAD:main

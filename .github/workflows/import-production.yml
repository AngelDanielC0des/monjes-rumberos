name: Import complete Monjes Rumberos project
# v2: reproducible npm lockfile is committed before the import workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-production.yml"

permissions:
  contents: write

concurrency:
  group: monjes-rumberos-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project source
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/source-part-*.b64 > /tmp/monjes-source.tar.gz.b64
          base64 --decode /tmp/monjes-source.tar.gz.b64 | tar -xz
          rm -rf transfer
          if [[ -f .github/workflows/ci.yml ]]; then sed -i 's/runs-on: ubuntu-latest/runs-on: ubuntu-24.04/' .github/workflows/ci.yml; fi
          python - <<'PY'
          from pathlib import Path
          import re
          test = Path("tests/smoke-test.mjs")
          source = test.read_text(encoding="utf-8")
          source, removed = re.subn(
              r"^\s*'assets/source/monje-(?:izquierdo|derecho)-crossed-master\.png': \d+,\n",
              "",
              source,
              flags=re.MULTILINE,
          )
          if removed != 2:
              raise SystemExit(f"Expected to remove 2 archival PNG checks, removed {removed}")
          test.write_text(source, encoding="utf-8")
          handoff = Path("docs/GITHUB_HANDOFF.md")
          with handoff.open("a", encoding="utf-8") as file:
              file.write("\n\n## Assets incluidos en GitHub\n\nEl repositorio conserva los assets transparentes WebP optimizados, los ciclos WebP/GIF, los ocho fondos responsive y todos los archivos necesarios para construir y desplegar la landing. Los dos PNG maestros de trabajo de assets/source no forman parte del build público y no se incluyen en esta importación; no se sustituyen por conversiones WebP de menor calidad.\n")
          PY
          test -s index.html
          test -s styles.css
          test -s GITHUB_PUBLIC_ASSETS.txt

      - name: Restore production image assets from Vercel
        shell: bash
        env:
          DEPLOY_URL: https://monjes-rumberos.vercel.app
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              assets/*)
                mkdir -p "$(dirname "$path")"
                curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$DEPLOY_URL/$path" --output "$path"
                ;;
            esac
          done < GITHUB_PUBLIC_ASSETS.txt
          test -s assets/images/monjes-frame.webp
          test -s assets/monks/monjes-frame-desktop.webp
          test -s assets/sections/manifest.json
          test "$(find assets/sections -maxdepth 1 -name '*.webp' | wc -l | tr -d ' ')" -eq 16

      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Verify source and responsive behavior
        run: |
          npm run check
          npm test
          npm run build
          test -s public/index.html
          test -s public/styles.css
          test -s public/assets/monks/dance/monje-left-dance.webp
          test -s public/assets/monks/dance/monje-right-dance.webp
          test "$(find public -type f | wc -l | tr -d ' ')" -eq 39

      - name: Commit complete source and assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The GitHub App token can push source/assets but not workflow files.
          # The CI workflow is added directly with the connected GitHub integration after this import.
          rm -f .github/workflows/ci.yml
          git add -A
          git commit -m "chore: import complete source, assets and responsive QA"
          git push origin HEAD:main

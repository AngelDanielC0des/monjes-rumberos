name: Phase 1 — RIFE dance interpolation candidates

on:
  push:
    branches:
      - 'codex/monjes-rumberos-phase-0'
    paths:
      - 'scripts/interpolate-dance-rife.py'
      - '.github/workflows/phase1-dance-candidates.yml'
      - 'assets/monks/dance/*.webp'

permissions:
  contents: read

jobs:
  interpolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU inference dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 Pillow==11.3.0 onnxruntime==1.23.2

      - name: Download pinned RIFE v4.9 ONNX model
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$RUNNER_TEMP/rife49.onnx" \
            "https://huggingface.co/edgetools/rife/resolve/18dcfbe2c349d5922e353708153581d2039c576c/rife49.onnx"
          echo "76e4cef9ab42fa7dd4e8f6e4aba47462051e3faa969e4bca6479784fbab0ac6f  $RUNNER_TEMP/rife49.onnx" | sha256sum --check

      - name: Generate 25 FPS RIFE candidates (RGB and alpha)
        run: |
          python scripts/interpolate-dance-rife.py \
            --model "$RUNNER_TEMP/rife49.onnx" \
            --output phase1-dance-candidates

      - name: Upload review-only candidates
        uses: actions/upload-artifact@v4
        with:
          name: phase1-rife-dance-candidates
          path: phase1-dance-candidates/
          if-no-files-found: error
          retention-days: 7

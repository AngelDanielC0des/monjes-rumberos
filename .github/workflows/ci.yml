name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: JavaScript and smoke checks
        run: |
          npm run check
          npm run test:smoke

      - name: Responsive Chromium regression
        run: npm run test:browser

      - name: Build static deployment
        run: |
          npm run build
          test -s public/index.html
          test -s public/styles.css
          test -s public/assets/monks/dance/monje-left-dance.webp
          test -s public/assets/monks/dance/monje-right-dance.webp
          test "$(find public -type f | wc -l | tr -d ' ')" -eq 39
